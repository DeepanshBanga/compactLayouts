<template> 
    <lightning-card title="Account Approval" class="white-border-card">
        <template if:false={isApproved}>
            <div class="slds-text-align_right slds-m-around_medium">
                <lightning-button 
                    label="Approve Account"
                    variant="brand"
                    onclick={handleApprove}>
                </lightning-button>
            </div>
        </template>

        <template if:true={isApproved}>
            <div class="slds-p-around_medium">
                <lightning-record-view-form 
                    record-id={recordId} 
                    object-api-name="Account">

                    <div class="slds-grid slds-wrap slds-gutters">
                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="OwnerId"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="Rating"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="Name"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="Phone"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="Fax"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="AccountNumber"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="Website"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="Site"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="Type"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="Ownership"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="Industry"></lightning-output-field>
                                </div>
                            </div>
                        </div>

                        <div class="slds-col slds-size_1-of-2">
                            <div class="field-container">
                                <div class="border-line">
                                    <lightning-output-field field-name="NumberOfEmployees"></lightning-output-field>
                                </div>
                            </div>
                        </div>
                    </div>

                </lightning-record-view-form>
            </div>
        </template>
    </lightning-card>
</template>
